<title>Maranza Escape</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    /* stesso azzurro del cielo del gioco e del manifest: senza, all'avvio in
       standalone si vede un lampo di un altro colore prima della strada */
    background: #7ea6cc;
    /* il gioco si comanda scorrendo: nessuna selezione, nessuno scroll da tocco */
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    /* niente lampo grigio al tocco su Safari iOS */
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* Due tele sovrapposte.
     - #gioco    la scena, disegnata da PixiJS (WebGPU, o WebGL2 dove manca):
                 e' quella che passa dentro luci e post-processing.
     - #interfaccia  punteggio, pulsanti e schermate, in canvas 2D sopra tutto.
                 Sta fuori dal post-processing apposta: una scritta sfocata
                 dall'aberrazione cromatica non si legge piu'. */
  #gioco, #interfaccia {
    position: fixed;
    top: 0;
    left: 0;
    display: block;
  }
  #gioco { z-index: 0; }
  #interfaccia { z-index: 1; }

  /* Non si vede: serve solo a misurare le zone coperte da tacca, isola
     dinamica e barra di casa. I valori si leggono da JavaScript. */
  #sicurezza {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    pointer-events: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
  }
</style>
</head>
<body>
  <canvas id="gioco"></canvas>
  <canvas id="interfaccia"></canvas>
  <div id="sicurezza"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
